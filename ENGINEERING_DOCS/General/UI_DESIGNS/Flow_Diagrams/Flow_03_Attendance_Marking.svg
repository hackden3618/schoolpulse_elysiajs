<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="800" fill="#F9FAFB"/>
  
  <text x="50" y="50" font-family="Inter, sans-serif" font-weight="bold" font-size="22" fill="#111827">Flow 03 — Attendance Marking Workflow</text>
  <text x="50" y="75" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">Durable transactional status flow with asynchronous parent notification triggers</text>
  
  <!-- Step 1: Start -->
  <rect x="50" y="140" width="160" height="50" rx="25" fill="#EBF5FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="171" font-family="Inter, sans-serif" font-weight="bold" font-size="13" fill="#1E40AF" text-anchor="middle">Teacher Logs In</text>
  
  <!-- Arrow -->
  <path d="M210 165 L260 165" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Select Class Instance -->
  <rect x="260" y="140" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="350" y="170" font-family="Inter, sans-serif" font-weight="medium" font-size="13" fill="#111827" text-anchor="middle">Select Class &amp; Session</text>
  
  <!-- Arrow -->
  <path d="M440 165 L490 165" fill="none" stroke="#9CA3AF" stroke-width="2" />
  
  <!-- Step 3: Decision - Is Session Locked? -->
  <polygon points="560,115 630,165 560,215 490,165" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="560" y="169" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#B45309" text-anchor="middle">Is Session Locked?</text>
  
  <!-- Branch 1: Yes (Locked) -->
  <path d="M560 115 L560 80 L660 80" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="565" y="100" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#B45309">YES</text>
  
  <rect x="660" y="55" width="220" height="50" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="770" y="85" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#991B1B" text-anchor="middle">Post-Lock Edit Workflow</text>
  <text x="770" y="98" font-family="Inter, sans-serif" font-size="10" fill="#991B1B" text-anchor="middle">(Requires Reason &amp; Audits Event)</text>
  
  <!-- Branch 2: No (Unlocked) -->
  <path d="M560 215 L560 265" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="570" y="240" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#10B981">NO</text>
  
  <!-- Step 4: Mark Grid -->
  <rect x="460" y="265" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="560" y="295" font-family="Inter, sans-serif" font-weight="medium" font-size="13" fill="#111827" text-anchor="middle">Mark P / A / L / E Grid</text>
  
  <!-- Arrow -->
  <path d="M560 315 L560 365" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Step 5: Submit & Lock -->
  <rect x="460" y="365" width="200" height="50" rx="8" fill="#1E40AF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="560" y="395" font-family="Inter, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">Submit &amp; Lock Session</text>
  
  <!-- Arrow -->
  <path d="M560 415 L560 465" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Step 6: Atomic DB Write & Outbox Event -->
  <rect x="410" y="465" width="300" height="70" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="560" y="495" font-family="Inter, sans-serif" font-weight="bold" font-size="13" fill="#065F46" text-anchor="middle">Write State &amp; Outbox Event</text>
  <text x="560" y="515" font-family="Inter, sans-serif" font-size="11" fill="#065F46" text-anchor="middle">(Atomic PostgreSQL Transaction)</text>
  
  <!-- Split into Async Worker -->
  <path d="M560 535 L560 595" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4"/>
  <text x="570" y="565" font-family="Inter, sans-serif" font-style="italic" font-size="12" fill="#059669">Async Event Trigger</text>
  
  <!-- Step 7: Outbox Worker processes AttendanceMarked -->
  <rect x="440" y="595" width="240" height="50" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="560" y="625" font-family="Inter, sans-serif" font-weight="semibold" font-size="13" fill="#374151" text-anchor="middle">Outbox Worker: AttendanceMarked</text>
  
  <!-- Arrow -->
  <path d="M680 620 L730 620" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Step 8: Decision - Student Absent/Late & Notifications enabled? -->
  <polygon points="810,580 880,620 810,660 740,620" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="810" y="624" font-family="Inter, sans-serif" font-weight="bold" font-size="10" fill="#B45309" text-anchor="middle">Absent / Late?</text>
  
  <!-- Yes Branch -->
  <path d="M810 580 L810 515" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="815" y="555" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#10B981">YES</text>
  
  <rect x="710" y="465" width="200" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="810" y="495" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#92400E" text-anchor="middle">Send SMS Alert to Guardian</text>
  
  <!-- No Branch -->
  <path d="M810 660 L810 710" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="815" y="685" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#EF4444">NO</text>
  
  <rect x="730" y="710" width="160" height="40" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="810" y="734" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#4B5563" text-anchor="middle">End Process</text>
  
  <!-- SVG Marker definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="850" fill="#F9FAFB"/>
  
  <text x="50" y="50" font-family="Inter, sans-serif" font-weight="bold" font-size="22" fill="#111827">Flow 04 — Fee Payment &amp; Reconciliation Flow</text>
  <text x="50" y="75" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">Multi-channel payment entry with transactional ledger safety, duplication checks, and async receipts</text>
  
  <!-- Step 1: Start -->
  <rect x="50" y="140" width="160" height="50" rx="25" fill="#EBF5FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="171" font-family="Inter, sans-serif" font-weight="bold" font-size="13" fill="#1E40AF" text-anchor="middle">Select Student Acct</text>
  
  <!-- Arrow -->
  <path d="M210 165 L260 165" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Step 2: Choose Method -->
  <rect x="260" y="140" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="340" y="170" font-family="Inter, sans-serif" font-weight="medium" font-size="13" fill="#111827" text-anchor="middle">Choose Payment Method</text>
  
  <!-- Arrow -->
  <path d="M420 165 L470 165" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Decision: Is M-Pesa STK? -->
  <polygon points="530,120 590,165 530,210 470,165" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="530" y="169" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#B45309" text-anchor="middle">Is M-Pesa STK?</text>
  
  <!-- YES branch -->
  <path d="M530 120 L530 75 L620 75" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="535" y="100" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#10B981">YES</text>
  
  <rect x="620" y="50" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="710" y="80" font-family="Inter, sans-serif" font-weight="medium" font-size="12" fill="#111827" text-anchor="middle">Initiate Mobile STK Push</text>
  
  <path d="M800 75 L840 75 L840 140" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <rect x="750" y="140" width="180" height="50" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2"/>
  <text x="840" y="170" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#9F1239" text-anchor="middle">M-Pesa Callback Endpoint</text>
  
  <!-- NO branch -->
  <path d="M530 210 L530 255" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="540" y="235" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#EF4444">NO</text>
  
  <!-- Step 3: Manual Entry -->
  <rect x="430" y="255" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="530" y="280" font-family="Inter, sans-serif" font-weight="medium" font-size="12" fill="#111827" text-anchor="middle">Bursar Manual Entry (Slip/Cash)</text>
  <text x="530" y="293" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Enter reference &amp; amount</text>
  
  <!-- Arrow -->
  <path d="M530 305 L530 355" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Decision: Ref Duplicated? -->
  <polygon points="530,355 590,400 530,445 470,400" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="530" y="404" font-family="Inter, sans-serif" font-weight="bold" font-size="10" fill="#B45309" text-anchor="middle">Duplicate Ref?</text>
  
  <!-- YES branch (Duplicated) -->
  <path d="M470 400 L390 400" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="420" y="390" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#EF4444">YES</text>
  
  <rect x="190" y="375" width="200" height="50" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="290" y="405" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#991B1B" text-anchor="middle">Reject: VALIDATION_ERROR</text>
  
  <!-- Merge paths from callback and valid manual entries -->
  <path d="M840 190 L840 475 L680 475" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <path d="M530 445 L530 475 L380 475" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="540" y="465" font-family="Inter, sans-serif" font-weight="bold" font-size="11" fill="#10B981">NO</text>
  
  <!-- Step 4: Write Ledger and Outbox -->
  <rect x="380" y="495" width="300" height="75" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="530" y="525" font-family="Inter, sans-serif" font-weight="bold" font-size="13" fill="#065F46" text-anchor="middle">Write Ledger Transaction</text>
  <text x="530" y="542" font-family="Inter, sans-serif" font-size="10" fill="#065F46" text-anchor="middle">(Debit reduction, credit balance, emit PaymentReceived event)</text>
  
  <!-- Async Trigger line -->
  <path d="M530 570 L530 630" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4"/>
  <text x="540" y="600" font-family="Inter, sans-serif" font-style="italic" font-size="12" fill="#059669">Async Event Trigger</text>
  
  <!-- Step 5: Worker -->
  <rect x="410" y="630" width="240" height="50" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="530" y="660" font-family="Inter, sans-serif" font-weight="semibold" font-size="13" fill="#374151" text-anchor="middle">Outbox Worker: PaymentReceived</text>
  
  <!-- Arrow to Split actions -->
  <path d="M530 680 L530 710" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Parallel actions -->
  <path d="M530 710 L380 710 L380 740" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <path d="M530 710 L680 710 L680 740" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  
  <rect x="280" y="740" width="200" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="380" y="770" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#0369A1" text-anchor="middle">Generate Official PDF Receipt</text>
  
  <rect x="580" y="740" width="200" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="680" y="770" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#92400E" text-anchor="middle">SMS Confirmation to Parent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F3F4F6"/>
  
  <!-- Left Column - Branding Pitch -->
  <rect x="0" y="0" width="500" height="800" fill="#1E40AF"/>
  <circle cx="250" cy="220" r="60" fill="#FFFFFF" fill-opacity="0.1"/>
  <path d="M220 220 L250 190 L280 220 L260 220 L260 250 L240 250 L240 220 Z" fill="#FFFFFF"/>
  <circle cx="250" cy="220" r="10" fill="#F59E0B"/>
  
  <text x="250" y="320" font-family="Inter, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">SchoolPulse</text>
  <text x="250" y="355" font-family="Inter, sans-serif" font-weight="medium" font-size="14" fill="#93C5FD" text-anchor="middle">v1.1.0 Management Suite</text>
  
  <text x="250" y="440" font-family="Inter, sans-serif" font-weight="normal" font-size="15" fill="#E0F2FE" text-anchor="middle" width="360">
    <tspan x="250" dy="0">Run your school with the clarity,</tspan>
    <tspan x="250" dy="24">discipline, and confidence of</tspan>
    <tspan x="250" dy="24">a modern cloud institution.</tspan>
  </text>
  
  <text x="250" y="740" font-family="Inter, sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">© 2026 SchoolPulse Kenya. All rights reserved.</text>
  
  <!-- Right Column - Login Box Container -->
  <!-- Container shadow card -->
  <rect x="650" y="150" width="450" height="500" rx="12" fill="#FFFFFF" filter="drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.05))" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="700" y="210" font-family="Inter, sans-serif" font-weight="bold" font-size="24" fill="#111827">Staff Sign In</text>
  <text x="700" y="235" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">Enter your credentials to access your portal</text>
  
  <!-- Form Field: Username/Email -->
  <text x="700" y="295" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#374151">Phone Number or Email</text>
  <rect x="700" y="305" width="350" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="716" y="331" font-family="Inter, sans-serif" font-size="14" fill="#9CA3AF">e.g. +254 712 345678 or teacher@school.ac.ke</text>
  
  <!-- Form Field: Password -->
  <text x="700" y="385" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#374151">Password</text>
  <rect x="700" y="395" width="350" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="716" y="421" font-family="Inter, sans-serif" font-size="18" fill="#111827" letter-spacing="4">••••••••••••</text>
  
  <!-- Remember Me & Forgot Password -->
  <rect x="700" y="460" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="724" y="473" font-family="Inter, sans-serif" font-size="13" fill="#4B5563">Remember me</text>
  <text x="945" y="473" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#1E40AF" text-anchor="end">Forgot Password?</text>
  
  <!-- Sign In Button -->
  <rect x="700" y="505" width="350" height="46" rx="6" fill="#1E40AF"/>
  <text x="875" y="533" font-family="Inter, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF" text-anchor="middle">Sign In to Dashboard</text>
  
  <!-- Parent Login Redirect -->
  <rect x="700" y="575" width="350" height="1" fill="#E5E7EB"/>
  <text x="875" y="605" font-family="Inter, sans-serif" font-size="13" fill="#4B5563" text-anchor="middle">
    Are you a student's parent or guardian?
  </text>
  <text x="875" y="625" font-family="Inter, sans-serif" font-weight="bold" font-size="14" fill="#F59E0B" text-anchor="middle">
    Sign In with Phone OTP
  </text>
</svg>
